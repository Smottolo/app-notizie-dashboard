name: Controllo data.json
on:
  push:
    paths: ["data.json", "scripts/validate-data.mjs"]
  pull_request:
    paths: ["data.json"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-data.mjs data.json
